# JVM options for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build performance.
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX is required for all modern Jetpack / Compose libraries.
android.useAndroidX=true

# Generate per-module R classes (smaller, faster, avoids accidental cross-module resource leakage).
android.nonTransitiveRClass=true

# Use the official Kotlin code style.
kotlin.code.style=official
